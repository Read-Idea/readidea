<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사전예약 — '뺍'</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: #ffffff;
    color: #111111;
  }
  a { color: inherit; }
  input::placeholder { color: #b7b1a0; }
  input { font-family: inherit; }
  * { box-sizing: border-box; }

  .pr-page {
    min-height: 100dvh;
    width: 100%;
    position: relative;
    overflow-x: hidden;
  }

  .pr-scroll {
    min-height: 100dvh;
    overflow-y: auto;
  }

  .pr-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(77px + env(safe-area-inset-top, 0px)) 43px 0;
  }
  .pr-logo { width: 73px; height: auto; display: block; margin: 0; }
  .pr-title { margin: 6px 0 0; font-size: 16px; font-weight: 400; color: #111111; text-align: center; text-wrap: balance; }
  .pr-sub { margin: 5px 0 0; font-size: 13px; font-weight: 400; color: #111111; text-align: center; }

  .pr-form { padding: 36px 43px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .pr-field { display: flex; flex-direction: column; gap: 8px; }
  .pr-field + .pr-field { margin-top: 18px; }
  .pr-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .pr-label { font-size: 12px; font-weight: 400; color: #111111; }
  .pr-label.pr-error-label { color: #ff3131; }
  .pr-error-text { font-size: 12px; font-weight: 400; color: #ff3131; display: none; }
  .pr-error-text.show { display: inline; }

  .pr-input {
    height: 43px;
    border-radius: 7px;
    border: 1.5px solid #111111;
    padding: 0 16px;
    font-size: 15px;
    width: 100%;
  }
  .pr-input.pr-error { border-color: #ff3131; color: #ff3131; }

  .pr-consent { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .pr-consent label { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; }
  .pr-consent input[type="checkbox"] { margin-top: 2px; width: 16px; height: 16px; flex-shrink: 0; }
  .pr-consent .req { color: #111111; }
  .pr-consent .opt { color: #8a8575; }

  .pr-btn-wrap { position: relative; margin: 80px auto 0; padding-bottom: 1px; width: 138px; max-width: 100%; }
  .pr-btn-bottom, .pr-btn-top {
    height: 30px;
    border-radius: 15px;
    border: 1.5px solid #000000;
    background: #ffffff;
  }
  .pr-btn-bottom { transform: translateY(1px); }
  .pr-btn-top {
    position: absolute;
    inset: 0 0 auto 0;
    width: 100%;
    color: #000000;
    font-size: 15px;
    font-weight: 400;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .pr-btn-top:disabled { cursor: not-allowed; }
  .pr-btn-top.pressed { transform: translateY(1px); }
  .pr-btn-wrap.active .pr-btn-bottom,
  .pr-btn-wrap.active .pr-btn-top { background: #00e6ee; }
  .pr-btn-veil {
    position: absolute;
    inset: 0 0 auto 0;
    width: 100%;
    height: calc(30px + 1px);
    border-radius: 15px;
    background: rgba(255,255,255,0.55);
    pointer-events: none;
    transition: opacity .15s ease;
    opacity: 1;
  }
  .pr-btn-wrap.active .pr-btn-veil { opacity: 0; }

  .pr-done { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding: 40px 43px; }
  .pr-done-title { font-size: 18px; font-weight: 400; color: #111111; }
  .pr-done-sub { font-size: 13.5px; color: #8a8575; line-height: 1.6; }

  .pr-hidden { display: none !important; }

  .pr-popup-veil {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: rgba(255,255,255,0.88);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pr-popup {
    position: relative;
    width: calc(100% - 29px - 29px);
    max-width: 420px;
    height: 90px;
    background: #ffffff;
    border: 1.5px solid #111111;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .pr-popup-close {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    border: none;
    background: transparent;
    font-size: 25px;
    line-height: 1;
    color: #111111;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .pr-popup-text {
    margin: 0;
    font-size: 13px;
    font-weight: 400;
    color: #111111;
    text-align: center;
    line-height: 1.5;
    white-space: nowrap;
  }
</style>
</head>

      <h1 class="pr-title">'뺍'에 오신 것을 환영합니다!</h1>
      <p class="pr-sub">사전예약하고 첫 유저가 되어보세요&lt;3</p>
    </div>

    <form class="pr-form" id="pr-form">
      <div id="pr-form-fields">
        <div class="pr-field">
          <label class="pr-label" for="pr-name">이름*</label>
          <input class="pr-input" id="pr-name" name="name" type="text" placeholder="이장이" autocomplete="name" required />
        </div>

        <div class="pr-field">
          <div class="pr-label-row">
            <label class="pr-label" id="pr-email-label" for="pr-email">이메일*</label>
            <span class="pr-error-text" id="pr-email-error">올바른 이메일 형식이 아닙니다.</span>
          </div>
          <input class="pr-input" id="pr-email" name="email" type="email" inputmode="email" placeholder="example@gmail.com" autocomplete="email" required />
        </div>

        <div class="pr-field">
          <label class="pr-label" for="pr-phone">전화번호</label>
          <input class="pr-input" id="pr-phone" name="phone" type="tel" inputmode="tel" placeholder="01012345678" autocomplete="tel" />
        </div>

        <div class="pr-consent">
          <label>
            <input type="checkbox" id="pr-agree-required" required />
            <span class="req">[필수] 개인정보 수집·이용에 동의합니다 (<a href="/privacy-policy.html" id="pr-privacy-link" target="_blank" rel="noopener">자세히</a>)</span>
          </label>
          <label>
            <input type="checkbox" id="pr-agree-marketing" />
            <span class="opt">[선택] 출시 소식·혜택 안내 이메일 수신에 동의합니다</span>
          </label>
        </div>

        <div class="pr-btn-wrap" id="pr-btn-wrap">
          <div class="pr-btn-bottom"></div>
          <button class="pr-btn-top" id="pr-submit-btn" type="submit" disabled>사전예약 신청</button>
          <div class="pr-btn-veil"></div>
        </div>
      </div>

      <div class="pr-done pr-hidden" id="pr-done">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="#111111" stroke-width="1.6"/><path d="m8 12.5 2.5 2.5 5.5-6" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="pr-done-title">사전예약이 완료됐어요!</div>
        <div class="pr-done-sub" id="pr-done-sub"></div>
      </div>
    </form>

  </div>
</div>

<div class="pr-popup-veil pr-hidden" id="pr-popup-veil">
  <div class="pr-popup">
    <button class="pr-popup-close" id="pr-popup-close" type="button" aria-label="닫기">×</button>
    <p class="pr-popup-text">이미 사전예약을 완료하신 이메일 주소입니다.</p>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://bymdtggohqspxhozqess.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_fpfMZGMEllo5awlQ7feqbw_JdrSKVJD';

  var nameInput = document.getElementById('pr-name');
  var emailInput = document.getElementById('pr-email');
  var phoneInput = document.getElementById('pr-phone');
  var agreeRequired = document.getElementById('pr-agree-required');
  var agreeMarketing = document.getElementById('pr-agree-marketing');
  var emailLabel = document.getElementById('pr-email-label');
  var emailError = document.getElementById('pr-email-error');
  var btnWrap = document.getElementById('pr-btn-wrap');
  var submitBtn = document.getElementById('pr-submit-btn');
  var form = document.getElementById('pr-form');
  var fieldsBlock = document.getElementById('pr-form-fields');
  var doneBlock = document.getElementById('pr-done');
  var doneSub = document.getElementById('pr-done-sub');
  var popupVeil = document.getElementById('pr-popup-veil');
  var popupClose = document.getElementById('pr-popup-close');

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function updateButtonState() {
    var canSubmit = !!(nameInput.value.trim() && emailInput.value.trim() && agreeRequired.checked);
    submitBtn.disabled = !canSubmit;
    btnWrap.classList.toggle('active', canSubmit);
  }

  function clearEmailError() {
    emailInput.classList.remove('pr-error');
    emailLabel.classList.remove('pr-error-label');
    emailError.classList.remove('show');
  }

  emailInput.addEventListener('input', clearEmailError);
  emailInput.addEventListener('blur', function () {
    var v = emailInput.value.trim();
    if (v.length > 0 && !isValidEmail(v)) {
      emailInput.classList.add('pr-error');
      emailLabel.classList.add('pr-error-label');
      emailError.classList.add('show');
    } else {
      clearEmailError();
    }
  });

  [nameInput, emailInput, agreeRequired].forEach(function (el) {
    el.addEventListener('input', updateButtonState);
    el.addEventListener('change', updateButtonState);
  });

  submitBtn.addEventListener('mousedown', function () { submitBtn.classList.add('pressed'); });
  ['mouseup', 'mouseleave'].forEach(function (evt) {
    submitBtn.addEventListener(evt, function () { submitBtn.classList.remove('pressed'); });
  });
  submitBtn.addEventListener('touchstart', function () { submitBtn.classList.add('pressed'); });
  submitBtn.addEventListener('touchend', function () { submitBtn.classList.remove('pressed'); });

  popupClose.addEventListener('click', function () {
    popupVeil.classList.add('pr-hidden');
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (submitBtn.disabled) return;

    var payload = {
      name: nameInput.value.trim(),
      email: emailInput.value.trim(),
      phone: phoneInput.value.trim() || null,
      agree_marketing: agreeMarketing.checked
    };

    submitBtn.disabled = true;

    fetch(SUPABASE_URL + '/rest/v1/preregistrations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(payload)
    }).then(function (res) {
      if (res.ok) {
        doneSub.textContent = payload.name + '님, 출시 소식을 가장 먼저 보내드릴게요.';
        fieldsBlock.classList.add('pr-hidden');
        doneBlock.classList.remove('pr-hidden');
        return;
      }
      if (res.status === 409) {
        popupVeil.classList.remove('pr-hidden');
        updateButtonState();
        return;
      }
      updateButtonState();
      alert('신청 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.');
    }).catch(function () {
      updateButtonState();
      alert('네트워크 오류로 신청하지 못했어요. 잠시 후 다시 시도해주세요.');
    });
  });

  updateButtonState();
})();
</script>
